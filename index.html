<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clamp Generator</title>
  <style>
        body {
            font-family: Arial;
            background: #f6f6f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .popup {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 9px;
            margin: 6px 0 15px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
            background: #007bff;
            color: #fff;
        }

        button:hover {
            background: #0065d3;
        }

        #output {
            background: #f1f1f1;
            padding: 12px;
            border-radius: 6px;
            margin-top: 18px;
            font-size: 16px;
            text-align: center;
            word-break: break-all;
        }

        #copied {
            text-align: center;
            color: green;
            font-size: 14px;
            margin-top: 6px;
            display: none;
        }
  </style>
</head>
<body>

<div class="popup">
    <h2>Clamp Generator</h2>

    <label>Design Width (px)</label>
    <input type="number" id="design_w" placeholder="1920">

    <label>Max Font Size (px)</label>
    <input type="number" id="max_px" placeholder="33">

    <label>Min Font Size (px)</label>
    <input type="number" id="min_px" placeholder="19">

    <button onclick="generateAndCopy()">Generate & Copy</button>

    <div id="output">Output will appear here</div>
    <div id="copied">Copied to clipboard ✔</div>
</div>

<script>
    function generateAndCopy() {
        const min_px = +document.getElementById('min_px').value;
        const max_px = +document.getElementById('max_px').value;
        const design_w = +document.getElementById('design_w').value;

        if (!min_px || !max_px || !design_w) {
            document.getElementById('output').innerText = "Please fill all fields!";
            document.getElementById('copied').style.display = 'none';
            return;
        }

        const vw = ((max_px / design_w) * 100).toFixed(2);
        const clampCode = `clamp(${min_px}px, ${vw}vw, ${max_px}px)`;

        // Show output
        document.getElementById('output').innerText = clampCode;

        // Copy to clipboard
        navigator.clipboard.writeText(clampCode).then(() => {
            const copiedMsg = document.getElementById('copied');
            copiedMsg.style.display = 'block';

            // Hide message after 2 seconds
            setTimeout(() => copiedMsg.style.display = 'none', 2000);
        });
    }
</script>

</body>
</html>
